[build-system]
requires = ["setuptools==82.0.1", "wheel==0.47.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tinyharness"
version = "0.1.0"
description = "Tiny harness for Qwen-backed Claude-style Terminal-Bench smoke runs."
readme = "AGENTS.md"
requires-python = ">=3.12"
dependencies = [
  "claude-agent-sdk==0.1.48",
  "dspy==3.2.1",
  "fastapi==0.135.1",
  "gepa[dspy]==0.0.27",
  "harbor==0.1.45",
  "httpx==0.28.1",
  "mlflow[auth]==3.10.1",
  "modal==1.3.5",
  "uvicorn==0.41.0",
]

[project.scripts]
tinyharness = "tinyharness.cli:main"

[dependency-groups]
dev = [
  "pytest==9.0.2",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tinyharness = ["templates/*.j2"]

[tool.uv]
package = true
